<!DOCTYPE html>
<!-- Based on Godot 4.7.2's full-size shell; activation must precede the isolation reload. -->
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
	z-index: 10;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

#status-details {
	margin-top: 1rem;
	z-index: 1;
}

#status-details summary {
	cursor: pointer;
	text-align: center;
}

#status-error-log {
	max-height: 10rem;
	max-width: min(48rem, 80vw);
	overflow: auto;
	white-space: pre-wrap;
	text-align: left;
	z-index: 1;
}

#status-retry {
	display: none;
	margin-top: 1rem;
	padding: 0.7rem 1.2rem;
	font: inherit;
	cursor: pointer;
	z-index: 1;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice" role="alert"></div>
			<details id="status-details" hidden>
				<summary>错误详情</summary>
				<pre id="status-error-log"></pre>
			</details>
			<button id="status-retry" type="button">重新加载最新版</button>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const statusDetails = document.getElementById('status-details');
	const errorLog = document.getElementById('status-error-log');
	const retryButton = document.getElementById('status-retry');

	let statusMode = '';
	let failed = false;
	const errorLines = [];

	function setStatusMode(mode) {
		if (statusMode === mode) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.style.visibility = 'hidden';
			statusMode = mode;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function appendError(message) {
		errorLines.push(message);
		if (errorLines.length > 20) errorLines.shift();
		errorLog.textContent = errorLines.join('\n');
	}

	function displayFailureNotice(err) {
		console.error(err);
		failed = true;
		appendError(err instanceof Error ? err.message : String(err || 'An unknown error occurred.'));
		statusDetails.hidden = false;
		setStatusNotice('游戏运行出错。可以重新加载最新版再试一次。');
		setStatusMode('notice');
		retryButton.style.display = 'block';
	}

	// Registration resolves before installation/activation finishes. Wait for an
	// active worker before reloading so the navigation gets isolation headers.
	function waitForActiveWorker(registration) {
		return new Promise((resolve, reject) => {
			const workers = new Set();
			const timeout = setTimeout(() => finish(new Error(
				'启动准备超时，请检查网络后刷新页面。')), 30000);
			function finish(error) {
				clearTimeout(timeout);
				registration.removeEventListener('updatefound', check);
				workers.forEach((worker) => worker.removeEventListener('statechange', check));
				if (error) reject(error);
				else resolve();
			}
			function check() {
				if (!registration.installing && !registration.waiting
						&& registration.active && registration.active.state === 'activated') {
					finish();
					return;
				}
				const worker = registration.installing || registration.waiting || registration.active;
				if (!worker) {
					finish(new Error('启动缓存安装失败，请检查网络后刷新页面。'));
					return;
				}
				if (worker.state === 'redundant') {
					finish(new Error('启动缓存安装失败，请检查网络后刷新页面。'));
					return;
				}
				if (!workers.has(worker)) {
					workers.add(worker);
					worker.addEventListener('statechange', check);
				}
				// An existing worker may be waiting for an older tab to close.
				if (worker.state === 'installed') worker.postMessage('claim');
			}
			registration.addEventListener('updatefound', check);
			check();
		});
	}

	retryButton.addEventListener('click', async () => {
		if (retryButton.disabled) return;
		retryButton.disabled = true;
		retryButton.textContent = '正在更新…';
		setStatusNotice('正在获取最新版，请稍候…');
		const controller = new AbortController();
		let timeout;
		try {
			await Promise.race([
				(async () => {
					if (GODOT_CONFIG.serviceWorker && 'serviceWorker' in navigator) {
						const registration = await engine.installServiceWorker();
						if (!registration) throw new Error('浏览器无法注册 service worker。');
						await registration.update();
						await waitForActiveWorker(registration);
					}
					controller.signal.throwIfAborted();
					if ('caches' in window) {
						const keys = await window.caches.keys();
						controller.signal.throwIfAborted();
						await Promise.all(keys.filter(key => key.startsWith('Age of Empire Li-sw-cache-'))
							.map(key => window.caches.delete(key)));
					}
					controller.signal.throwIfAborted();
					// Refresh the HTTP cache too: a normal reload can reuse the old pack.
					const executable = GODOT_CONFIG.executable;
					const files = [`${executable}.html`, `${executable}.js`, ...Object.keys(GODOT_CONFIG.fileSizes || {})];
					await Promise.all(files.map(async file => {
						const response = await fetch(file, {cache: 'reload', signal: controller.signal});
						if (!response.ok) throw new Error(`无法下载 ${file}（HTTP ${response.status}）。`);
						await response.arrayBuffer();
					}));
				})(),
				new Promise((_, reject) => {
					timeout = setTimeout(() => reject(new Error('更新超时，请检查网络后重试。')), 60000);
				}),
			]);
			sessionStorage.removeItem('aoe-isolation-reload:' + GODOT_CONFIG.serviceWorker);
			window.location.reload();
		} catch (err) {
			displayFailureNotice(err);
			setStatusNotice('更新未完成。请检查网络后再次点击「重新加载最新版」。');
		} finally {
			clearTimeout(timeout);
			controller.abort();
			retryButton.disabled = false;
			retryButton.textContent = '重新加载最新版';
		}
	});

	async function prepareIsolation() {
		setStatusNotice('正在准备游戏运行环境，完成后将自动刷新…');
		setStatusMode('notice');
		const reloadKey = 'aoe-isolation-reload:' + GODOT_CONFIG.serviceWorker;
		const lastReload = Number(sessionStorage.getItem(reloadKey) || 0);
		if (Date.now() - lastReload < 60000) {
			throw new Error('浏览器未启用多线程运行环境。请允许本站的 service worker，或使用新版 Chrome / Firefox。');
		}
		let timeout;
		try {
			await Promise.race([
				(async () => {
					const registration = await engine.installServiceWorker();
					if (!registration) throw new Error('浏览器无法注册 service worker。');
					await waitForActiveWorker(registration);
				})(),
				new Promise((_, reject) => {
					timeout = setTimeout(() => reject(new Error(
						'启动准备超时，请检查网络后刷新页面。')), 30000);
				}),
			]);
		} finally {
			clearTimeout(timeout);
		}
		sessionStorage.setItem(reloadKey, String(Date.now()));
		window.location.reload();
	}

	const missing = Engine.getMissingFeatures({threads: GODOT_THREADS_ENABLED});
	const missingWithoutThreads = Engine.getMissingFeatures({threads: false});
	if (missing.length !== 0) {
		if (missingWithoutThreads.length === 0 && GODOT_CONFIG.serviceWorker
				&& GODOT_CONFIG.ensureCrossOriginIsolationHeaders && 'serviceWorker' in navigator) {
			prepareIsolation().catch(displayFailureNotice);
		} else {
			displayFailureNotice('当前浏览器缺少游戏所需功能：\n' + missing.join('\n'));
		}
	} else {
		try { sessionStorage.removeItem('aoe-isolation-reload:' + GODOT_CONFIG.serviceWorker); } catch (_) {}
		setStatusMode('progress');
		engine.startGame({
			'onPrintError': function (...args) {
				const message = args.map(String).join(' ');
				if (/SCRIPT ERROR:|^ERROR:/.test(message)) {
					displayFailureNotice(message);
				} else {
					console.error(...args);
					if (failed) appendError(message);
				}
			},
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			if (!failed) setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
