name: Build and publish Web game

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      EMSCRIPTEN_VERSION: '4.0.0'
      BUILD_JOBS: '4'
    steps:
      - name: Check out game
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Restore Web template
        id: template
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: docs/godot/bin/godot.web.template_release.wasm32.zip
          key: web-template-${{ runner.os }}-${{ runner.arch }}-emscripten-${{ env.EMSCRIPTEN_VERSION }}-${{ hashFiles('tools/build_godot_web.sh') }}

      - name: Install Emscripten and build Web template
        if: steps.template.outputs.cache-hit != 'true'
        run: |
          python3 -m pip install scons==4.11.1
          git clone --depth 1 --branch "$EMSCRIPTEN_VERSION" https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSCRIPTEN_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSCRIPTEN_VERSION"
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          make build-web

      - name: Export game with Godot 4.7.2
        run: |
          mkdir -p docs/godot
          touch docs/godot/.gdignore
          tools/export_web.sh
          touch build/web/.nojekyll
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck
          test -s build/web/index.service.worker.js
          test -s build/web/index.manifest.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/web

      # GITHUB_TOKEN pushes do not trigger branch-based Pages builds, so the
      # deploy job below also publishes this exact artifact through the Pages API.
      - name: Commit export to pages branch
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          publish_dir="$RUNNER_TEMP/pages-branch"
          remote_branch="$(git ls-remote --heads origin refs/heads/pages)"
          if [[ -n "$remote_branch" ]]; then
            git fetch --depth=1 origin pages
            git worktree add --detach "$publish_dir" FETCH_HEAD
          else
            git worktree add --detach "$publish_dir"
            git -C "$publish_dir" checkout --orphan pages
          fi
          git -C "$publish_dir" rm -rf --ignore-unmatch .
          cp -a build/web/. "$publish_dir/"
          git -C "$publish_dir" add --all
          if ! git -C "$publish_dir" diff --cached --quiet; then
            git -C "$publish_dir" -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Deploy Web game from $SOURCE_SHA"
            git -C "$publish_dir" push origin HEAD:refs/heads/pages
          fi

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
