name: Build and publish Web game

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Check out game
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Godot and official export templates
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789 # v2.4.1
        with:
          version: '4.7.2'
          use-dotnet: false
          include-templates: true
          cache: true

      - name: Export game with Godot 4.7.2
        run: |
          GODOT_EDITOR="$GODOT" tools/export_web.sh
          touch build/web/.nojekyll
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck
          test -s build/web/index.service.worker.js
          test -s build/web/index.manifest.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/web

      # GITHUB_TOKEN pushes do not trigger branch-based Pages builds, so the
      # deploy job below also publishes this exact artifact through the Pages API.
      - name: Commit export to pages branch
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          publish_dir="$RUNNER_TEMP/pages-branch"
          remote_branch="$(git ls-remote --heads origin refs/heads/pages)"
          if [[ -n "$remote_branch" ]]; then
            git fetch --depth=1 origin pages
            git worktree add --detach "$publish_dir" FETCH_HEAD
          else
            git worktree add --detach "$publish_dir"
            git -C "$publish_dir" checkout --orphan pages
          fi
          git -C "$publish_dir" rm -rf --ignore-unmatch .
          cp -a build/web/. "$publish_dir/"
          git -C "$publish_dir" add --all
          if ! git -C "$publish_dir" diff --cached --quiet; then
            git -C "$publish_dir" -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Deploy Web game from $SOURCE_SHA"
            git -C "$publish_dir" push origin HEAD:refs/heads/pages
          fi

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
